<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>走访资料本地工作区</title>
<h1>走访资料</h1><button id="append">新增走访</button><button id="upgrade">升级资料结构</button><output id="status">载入中</output>
<script>
let database;
let serial = 2;
function openStore(version) {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('巡店资料', version);
    request.onupgradeneeded = () => {
      const storage = request.result;
      if (!storage.objectStoreNames.contains('visits')) storage.createObjectStore('visits', {keyPath:['store','visit']});
      if (!storage.objectStoreNames.contains('photos')) storage.createObjectStore('photos');
      if (version > 1 && !storage.objectStoreNames.contains('notes')) storage.createObjectStore('notes');
    };
    request.onerror = () => reject(request.error);
    request.onblocked = () => document.querySelector('#status').textContent = '升级被其他读取阻止';
    request.onsuccess = () => {
      database = request.result;
      database.onversionchange = () => database.close();
      resolve(database);
    };
  });
}
async function prepare() {
  await openStore(1);
  const transaction = database.transaction(['visits','photos'],'readwrite');
  transaction.objectStore('visits').put({store:'门店甲',visit:1,at:new Date('2026-11-01T08:00:00Z'),photo:'photo-a',flags:new Uint8Array([0,1,255])});
  transaction.objectStore('photos').put(new Blob([new Uint8Array([0,255,16,32])],{type:'application/octet-stream'}),'photo-a');
  transaction.oncomplete = () => { document.querySelector('#status').textContent = '资料就绪'; };
}
document.querySelector('#append').onclick = () => {
  const transaction = database.transaction(['visits'],'readwrite');
  transaction.objectStore('visits').put({store:'门店甲',visit:serial++,at:new Date(),photo:null});
  transaction.oncomplete = () => document.querySelector('#status').textContent = '走访已保存';
};
document.querySelector('#upgrade').onclick = async () => {database.close(); await openStore(2); document.querySelector('#status').textContent = '结构已升级';};
prepare();
</script></html>
